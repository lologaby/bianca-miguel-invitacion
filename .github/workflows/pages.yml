# Design preview on GitHub Pages.
#
# This is NOT the invitation. Pages is static hosting, so there is no worker and
# no /api/*: nobody can sign in with a code and no RSVP can be recorded. The
# build sets VITE_DEMO_PREVIEW=1, which opens the gate straight onto the demo
# invitation — placeholder venues, a placeholder date, no payment number. The
# real event lives only in the host's PRIVATE_EVENT_JSON and is in no bundle.
#
# Published at https://lologaby.github.io/bianca-miguel-invitacion/
#
# The real invitation lives at https://bianca-miguel-invitacion.vercel.app and is
# deployed by Vercel's own Git integration on every push — no workflow, no token.
name: Vista previa de diseño

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build:pages

      # A preview that leaks what the gate protects would defeat the point. This
      # file is public, so nothing private may be named here: the checks below
      # test SHAPES (a phone number, map coordinates) and assert the placeholders
      # survived the build. That catches the real event being mirrored into the
      # demo fixture, which is how a leak would actually happen. It cannot catch a
      # venue typed into free prose — for that the job would need
      # PRIVATE_EVENT_JSON as a repository secret to compare against.
      - name: Verificar que el bundle no lleve datos privados
        run: |
          if grep -rhoE "[0-9]{3}-[0-9]{3}-[0-9]{4}" dist-pages/assets/ | grep -qv "000-000-0000"; then
            echo "::error::El bundle de la vista previa contiene un número de teléfono."
            exit 1
          fi
          # Asserting the placeholders SURVIVED beats banning words: swapping in a
          # real venue removes them, and no private value has to be written here.
          # The previous check banned "iglesia" and "bodega de", which are ordinary
          # Spanish that the demo copy uses, so it failed every run on itself.
          for marcador in "Lugar de ceremonia" "Lugar de recepción" "Ciudad, Puerto Rico"; do
            if ! grep -rqF "$marcador" dist-pages/assets/; then
              echo "::error::Falta el marcador de lugar \"$marcador\": la vista previa podría llevar un lugar real."
              exit 1
            fi
          done
          # A real venue reaches a bundle through its map link before anywhere else,
          # so check that door specifically. Neither pattern can match this file.
          if grep -rqE "@-?[0-9]{1,3}[.][0-9]{3,},-?[0-9]{1,3}[.][0-9]{3,}" dist-pages/assets/; then
            echo "::error::El bundle lleva coordenadas, que apuntan a un lugar real."
            exit 1
          fi
          # every map query must be the placeholder, or empty because the component
          # builds it at runtime. The class stops at the backtick the minifier uses.
          if grep -rhoE "query=[A-Za-z0-9+._%-]*" dist-pages/assets/ | grep -qvE "^query=(Puerto[+]Rico)?$"; then
            echo "::error::Un enlace de mapa apunta a algo que no es el marcador."
            exit 1
          fi
          echo "Bundle limpio."

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
