guest_rules:
  maximum_party_size: 6
  plus_one_mode: "per-guest-record"
  children_policy: "per-guest-record"
  collect_dietary_notes: true
  collect_accessibility_notes: true

integrations:
  authoritative_rsvp_store: "upstash-redis"
  cms: "pendiente"
  music_search: "disabled-until-provider-is-selected"
  analytics: "off"

theme:
  direction: "minimalismo editorial de bodega"
  colors:
    ivory: "#F4F0E6"
    eucalyptus: "#647565"
    forest: "#23352D"
    wine: "#612F3B"
    ink: "#24241F"
    muted_brass: "#B69455"
  artwork_notes: "Ilustración original plana: copa, calas, tulipán, uvas y eucalipto."

deployment:
  provider: "Vercel"
  custom_domain: "PENDIENTE"
  indexing: "noindex-until-launch"
