privacy:
  public: ["nombres", "fecha", "iglesia", "recomendaciones aprobadas"]
  private: ["invitados", "códigos", "acompañantes", "RSVP", "notas alimentarias", "canciones"]
  secrets: ["SESSION_SECRET", "UPSTASH_REDIS_REST_URL", "UPSTASH_REDIS_REST_TOKEN", "GUESTS_JSON"]
  guest_data_retention: "exportar y eliminar después del evento"
  media_consent_reviewed: false
