  reception:
    name: "PENDIENTE"
    address: "PENDIENTE"

locales:
  default: "es"
  supported: ["es"]

experience:
  invitation_reveal: true
  background_audio: false
  countdown: true
  add_to_calendar: false
  faq: true
  maps: true
  gifts: false
  travel: true
  recommendations: true
  guest_codes: true
  personalized_rsvp: true
  song_requests: true
  event_phases: true
